<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Map</title>
<style>
html,body{margin:0;height:100%;background:#102838;overflow:hidden}
#view{display:block;width:100%;height:100%;touch-action:none}
.bar{position:absolute;z-index:5;top:12px;left:12px;display:flex;gap:10px;align-items:center;
background:#121212;border:1px solid #3a3a3a;border-radius:4px;padding:8px 10px;

.bar button{background:#1c1c1c;color:#fff;border:1px solid #3a3a3a;border-radius:4px;padding:4px 8px;cursor:pointer}
.bar button.on{background:#fff;color:#111}
.sw{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:0}
.xy{color:#9a9a9a}
</style>
</head>

  me = j.ok && j.me ? { x: j.me[0], y: j.me[1], h: j.me[2] } : null;
  if (me) {
    document.getElementById('xy').textContent = me.x.toFixed(1) + '   ' + me.y.toFixed(1);
    if (onMap(me.x, me.y)) {
      if (!haveFix) { haveFix = true; scale = Math.max(scale, 1); }
      if (follow) { camX = me.x; camY = me.y; }
    }
  }
  st.textContent = j.ok ? 'live' : 'waiting';
  dirty = true;
}
let es = null, lastMsg = 0, finding = false, lagBase = Infinity, openedAt = 0;
// Free tunnel hosts rotate. The game posts every new origin to ntfy; take the newest.
async function latestHost() {
  if (!topic) return host;
  try {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(topic) + '/json?poll=1&since=all', { cache: 'no-store' });
    const lines = (await r.text()).trim().split('\n');
    for (let i = lines.length - 1; i >= 0; i--) {
      try {
        const m = JSON.parse(lines[i]);
        if (m.event === 'message' && /^https:\/\/[a-z0-9.-]+$/i.test(m.message)) return m.message;
      } catch (e) {}
    }
  } catch (e) {}
  return host;
}
function connect() {
  if (es) es.close();
  lastMsg = Date.now();
  if (onPages && !host) { st.textContent = 'offline'; return; }
  st.textContent = 'connecting';
  es = new EventSource((onPages ? host : '') + '/api/stream?k=' + encodeURIComponent(key));
  lagBase = Infinity;
  openedAt = Date.now();
  es.onmessage = function (ev) {
    lastMsg = Date.now();
    let j;
    try { j = JSON.parse(ev.data); } catch (e) { return; }
    // Clocks differ, so track the smallest (arrival - server time) seen on this stream.
    // Frames 1.5 s behind that mean the tunnel is holding a queue: reopen to drop it.
    const off = lastMsg - (j.t || 0);
    if (off < lagBase) lagBase = off;
    if (off - lagBase > 1500 && lastMsg - openedAt > 4000) { connect(); return; }
    apply(j);
  };
  es.onerror = function () { st.textContent = 'reconnecting'; };
}
let firstTry = true;
async function reconnect() {
  if (finding) return;
  // On the tunnel the first try is always this origin; ntfy is only asked once it went quiet.
  if (!onPages && firstTry) { firstTry = false; connect(); return; }
  finding = true;
  host = await latestHost();
  finding = false;
  if (!onPages && host && host !== location.origin) {
    location.replace(host + '/?k=' + encodeURIComponent(key));
    return;
  }
  connect();
}
function openStream() {
  dirty = true;
  if (!key) { st.textContent = 'no link'; return; }
  reconnect();
  // Snapshots arrive ~10 times a second, so 6 s of silence means the tunnel moved.
  setInterval(function () { if (Date.now() - lastMsg > 6000) reconnect(); }, 2000);
}
// The tunnel keeps one lane per viewer: start the stream only after the page is in.
if (document.readyState === 'complete') openStream();
else window.addEventListener('load', openStream);
requestAnimationFrame(draw);
